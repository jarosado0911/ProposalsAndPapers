name: Build 2021 Submission PDFs

on:
  push:
    paths:
      - '2021 submission/**.tex'
      - '2021 submission/**.bib'
      - '**.sty'
      - '**.cls'
      - '.github/workflows/build-2021-submission.yml'
  pull_request:
    paths:
      - '2021 submission/**.tex'
      - '2021 submission/**.bib'
      - '**.sty'
      - '**.cls'
      - '.github/workflows/build-2021-submission.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-2021-submission
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for safe pushes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Auto-discover LaTeX root files in "2021 submission" by scanning for \documentclass
      - name: Discover LaTeX roots
        id: discover
        run: |
          set -euo pipefail
          cd "2021 submission"

          # Find .tex files that declare a document class (treat these as roots)
          ROOTS="$(grep -rl --include='*.tex' '^[[:space:]]*\\documentclass' . | sed 's|^\./||')"

          if [ -z "$ROOTS" ]; then
            echo "No LaTeX root files found in '2021 submission'." >&2
            exit 1
          fi

          printf 'ROOT_FILES<<EOF\n%s\nEOF\n' "$ROOTS" >> "$GITHUB_ENV"
          echo "Detected roots:"
          echo "$ROOTS"

      # Compile all detected roots (xu-cheng/latex-action builds multiple when given a newline list)
      - name: Compile LaTeX (latexmk)
        uses: xu-cheng/latex-action@v2
        with:
          root_file: ${{ env.ROOT_FILES }}
          working_directory: 2021 submission
          args: -pdf -interaction=nonstopmode -file-line-error
          # If you need xelatex/lualatex or shell-escape, uncomment as needed:
          # latexmk_use_xelatex: true
          # latexmk_use_lualatex: true
          # latexmk_shell_escape: true

      - name: List produced PDFs
        run: |
          ls -lh "2021 submission" || true
          ls -lh "2021 submission"/*.pdf || echo "No PDFs found."

      # Upload PDFs as run artifacts
      - name: Upload 2021 submission PDFs
        uses: actions/upload-artifact@v4
        with:
          name: 2021-submission-pdfs
          path: |
            2021 submission/*.pdf
          if-no-files-found: warn
          retention-days: 14

      # Commit PDFs back into the repo, keeping them locally in the "2021 submission" folder
      - name: Commit and push compiled PDFs
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          BRANCH="${GITHUB_REF#refs/heads/}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure we're up to date with the remote branch
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --rebase origin "$BRANCH"

          # Stage any (changed) PDFs from the 2021 submission folder
          git add "2021 submission"/*.pdf 2>/dev/null || true

          # Skip if nothing changed
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git commit -m "chore(2021 submission): update compiled PDFs [skip ci]"
          # Use lease to avoid overwriting newer remote commits
          git push --force-with-lease origin "$BRANCH"
