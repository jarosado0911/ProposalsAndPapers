name: Build 2021 Submission PDFs

on:
  push:
    paths:
      - '2021 submission/**.tex'
      - '2021 submission/**.bib'
      - '**.sty'
      - '**.cls'
      - '.github/workflows/build-2021-submission.yml'
  pull_request:
    paths:
      - '2021 submission/**.tex'
      - '2021 submission/**.bib'
      - '**.sty'
      - '**.cls'
      - '.github/workflows/build-2021-submission.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-2021-submission
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Build all root .tex files under "2021 submission" (detected by \documentclass)
      - name: Discover LaTeX roots
        id: discover
        run: |
          set -euo pipefail
          cd "2021 submission"
          ROOTS="$(grep -rl --include='*.tex' '^[[:space:]]*\\documentclass' . | sed 's|^\./||')"
          [ -n "$ROOTS" ] || { echo "No LaTeX roots found."; exit 1; }
          printf 'ROOT_FILES<<EOF\n%s\nEOF\n' "$ROOTS" >> "$GITHUB_ENV"
          echo "Detected roots:"
          echo "$ROOTS"

      - name: Compile LaTeX (latexmk)
        uses: xu-cheng/latex-action@v2
        with:
          root_file: ${{ env.ROOT_FILES }}
          working_directory: 2021 submission
          args: -pdf -interaction=nonstopmode -file-line-error
          # Uncomment if needed:
          # latexmk_use_xelatex: true
          # latexmk_use_lualatex: true
          # latexmk_shell_escape: true

      - name: List produced PDFs
        run: |
          ls -lh "2021 submission" || true
          ls -lh "2021 submission"/*.pdf || echo "No PDFs found."

      - name: Upload PDFs (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: 2021-submission-pdfs
          path: |
            2021 submission/*.pdf
          if-no-files-found: warn
          retention-days: 14

      # Commit PDFs back into the repo, keeping them in "2021 submission"
      - name: Commit and push compiled PDFs
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
        
          BRANCH="${GITHUB_REF#refs/heads/}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        
          # Rebase with autoStash so local (built) files don't block the pull
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git -c rebase.autoStash=true pull --rebase origin "$BRANCH"
        
          # Stage only PDFs; ignore aux/log/etc.
          git add "2021 submission"/*.pdf 2>/dev/null || true
        
          # Skip commit if nothing changed
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
        
          git commit -m "chore(2021 submission): update compiled PDFs [skip ci]"
          git push --force-with-lease origin "$BRANCH"
