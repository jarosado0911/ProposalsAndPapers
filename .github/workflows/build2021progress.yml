name: Build 2021 Progress PDFs

on:
  push:
    paths:
      - '2021 progress/**.tex'
      - '2021 progress/**.bib'
      - '**.sty'
      - '**.cls'
      - '.github/workflows/build-2021-progress.yml'
  pull_request:
    paths:
      - '2021 progress/**.tex'
      - '2021 progress/**.bib'
      - '**.sty'
      - '**.cls'
      - '.github/workflows/build-2021-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-2021-progress
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Detect LaTeX root files in "2021 progress" (files that declare \documentclass)
      - name: Discover LaTeX roots
        id: discover
        run: |
          set -euo pipefail
          cd "2021 progress"

          ROOTS="$(grep -rl --include='*.tex' '^[[:space:]]*\\documentclass' . | sed 's|^\./||')"
          if [ -z "$ROOTS" ]; then
            echo "No LaTeX root files found in '2021 progress'." >&2
            exit 1
          fi

          printf 'ROOT_FILES<<EOF\n%s\nEOF\n' "$ROOTS" >> "$GITHUB_ENV"
          echo "Detected roots:"
          echo "$ROOTS"

      # Build all detected roots with latexmk (output PDFs stay in "2021 progress")
      - name: Compile LaTeX (latexmk)
        uses: xu-cheng/latex-action@v2
        with:
          root_file: ${{ env.ROOT_FILES }}
          working_directory: 2021 progress
          args: -pdf -interaction=nonstopmode -file-line-error
          # Uncomment if needed:
          # latexmk_use_xelatex: true
          # latexmk_use_lualatex: true
          # latexmk_shell_escape: true

      - name: List produced PDFs
        run: |
          ls -lh "2021 progress" || true
          ls -lh "2021 progress"/*.pdf || echo "No PDFs found."

      # Upload PDFs as run artifacts (downloadable from Actions run)
      - name: Upload 2021 progress PDFs
        uses: actions/upload-artifact@v4
        with:
          name: 2021-progress-pdfs
          path: |
            2021 progress/*.pdf
          if-no-files-found: warn
          retention-days: 14

      # Commit PDFs back into the repo (keep them locally under "2021 progress")
      # Mindful of earlier issues: rebase first with autoStash, THEN stage/commit PDFs.
      - name: Commit and push compiled PDFs
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF#refs/heads/}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Rebase cleanly; autostash avoids "index contains uncommitted changes"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git -c rebase.autoStash=true pull --rebase origin "$BRANCH"

          # Stage only PDFs (ignore aux/log/etc.)
          git add "2021 progress"/*.pdf 2>/dev/null || true

          # Skip if nothing changed
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git commit -m "chore(2021 progress): update compiled PDFs [skip ci]"
          # Handle races safely
          git push --force-with-lease origin "$BRANCH"
